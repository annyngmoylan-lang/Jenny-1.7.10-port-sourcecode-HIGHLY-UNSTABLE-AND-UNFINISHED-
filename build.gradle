buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'

version = '1.1.0-1.7.10'
group = 'com.trolmastercard'
archivesBaseName = 'jenny-mod'

sourceCompatibility = targetCompatibility = '1.8'
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'run'
    mappings = 'stable_12'
}

// The recovered 1.12.2 sources are kept in src/main/java as a reference.
// Only the 1.7.10 compatibility implementation is compiled into this build.
sourceSets {
    main {
        java {
            srcDirs = ['src/port/java']
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', '1.7.10'
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.7.10'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// ForgeGradle 1.2 still points at the retired HTTP download URL for Minecraft.
def vanillaClientJar = new File(gradle.gradleUserHomeDir, 'caches/minecraft/net/minecraft/minecraft/1.7.10/minecraft-1.7.10.jar')
task downloadOfficialMinecraftClient {
    outputs.file vanillaClientJar
    doLast {
        def expectedSha1 = 'e80d9b3bf5085002218d4be59e668bac718abbc6'
        def actualSha1 = { File file ->
            java.security.MessageDigest.getInstance('SHA-1').digest(file.bytes).collect { String.format('%02x', it & 0xff) }.join()
        }
        if (!vanillaClientJar.exists() || actualSha1(vanillaClientJar) != expectedSha1) {
            vanillaClientJar.parentFile.mkdirs()
            def connection = new URL('https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar').openConnection()
            connection.connectTimeout = 30000
            connection.readTimeout = 60000
            connection.inputStream.withCloseable { input ->
                vanillaClientJar.withOutputStream { output ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = input.read(buffer)) >= 0) output.write(buffer, 0, count)
                }
            }
            if (actualSha1(vanillaClientJar) != expectedSha1) {
                vanillaClientJar.delete()
                throw new GradleException('Minecraft 1.7.10 client checksum did not match official metadata')
            }
        }
    }
}
downloadClient.enabled = false
downloadClient.dependsOn downloadOfficialMinecraftClient

def vanillaServerJar = new File(gradle.gradleUserHomeDir, 'caches/minecraft/net/minecraft/minecraft_server/1.7.10/minecraft_server-1.7.10.jar')
task downloadOfficialMinecraftServer {
    outputs.file vanillaServerJar
    doLast {
        def expectedSha1 = '952438ac4e01b4d115c5fc38f891710c4941df29'
        def actualSha1 = { File file ->
            java.security.MessageDigest.getInstance('SHA-1').digest(file.bytes).collect { String.format('%02x', it & 0xff) }.join()
        }
        if (!vanillaServerJar.exists() || actualSha1(vanillaServerJar) != expectedSha1) {
            vanillaServerJar.parentFile.mkdirs()
            def connection = new URL('https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar').openConnection()
            connection.connectTimeout = 30000
            connection.readTimeout = 60000
            connection.inputStream.withCloseable { input ->
                vanillaServerJar.withOutputStream { output ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = input.read(buffer)) >= 0) output.write(buffer, 0, count)
                }
            }
            if (actualSha1(vanillaServerJar) != expectedSha1) {
                vanillaServerJar.delete()
                throw new GradleException('Minecraft 1.7.10 server checksum did not match official metadata')
            }
        }
    }
}
downloadServer.enabled = false
downloadServer.dependsOn downloadOfficialMinecraftServer

// ForgeGradle 1.2's legacy S3 asset-index endpoint was retired. Keep the
// 1.7.10 asset index fetch on Mojang's content-addressed HTTPS endpoint.
tasks.getByName('getAssetsIndex').url = 'https://launchermeta.mojang.com/v1/packages/1863782e33ce7b584fc45b037325a1964e095d3e/1.7.10.json'
